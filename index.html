<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS · Global Financial Intelligence</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<style>
:root{
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  --font-mono:"SF Mono",SFMono-Regular,ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;
}
[data-theme="dark"]{
  --bg:#0b0e14; --bg2:#11151f; --bg3:#171c29; --bg4:#1e2434;
  --border:#232a3b; --border2:#2e3750;
  --text:#e8ecf4; --text2:#9aa5bd; --text3:#5f6a85;
  --accent:#4f8ef7; --accent2:#7c5cff;
  --pos:#2ecc71; --neg:#f05b5b; --neu:#e8b13f;
  --pos-bg:rgba(46,204,113,.12); --neg-bg:rgba(240,91,91,.12); --neu-bg:rgba(232,177,63,.12);
  --shadow:0 12px 40px rgba(0,0,0,.5);
  --map-sea:#0b0e14; --map-land:#1c2333; --map-stroke:#2a3348;
  --glass:rgba(17,21,31,.86);
}
[data-theme="light"]{
  --bg:#f6f7fa; --bg2:#ffffff; --bg3:#f0f2f7; --bg4:#e7eaf2;
  --border:#e2e6ef; --border2:#cdd4e2;
  --text:#171d2b; --text2:#5a6478; --text3:#98a1b5;
  --accent:#2f6fe4; --accent2:#6c4ce0;
  --pos:#13943f; --neg:#d63c3c; --neu:#b07d10;
  --pos-bg:rgba(19,148,63,.1); --neg-bg:rgba(214,60,60,.1); --neu-bg:rgba(176,125,16,.12);
  --shadow:0 12px 40px rgba(30,40,70,.14);
  --map-sea:#f6f7fa; --map-land:#dde3ee; --map-stroke:#c3cbdc;
  --glass:rgba(255,255,255,.92);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font-ui);font-size:14px;overflow:hidden;transition:background .25s,color .25s}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
input{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- Topbar ---------- */
#topbar{display:flex;align-items:center;gap:14px;height:52px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:relative;z-index:60}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px;letter-spacing:.06em;white-space:nowrap}
.logo .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 12px var(--accent)}
.logo small{color:var(--text3);font-weight:500;letter-spacing:.14em;font-size:9px;margin-left:2px}
#searchwrap{position:relative;flex:1;max-width:520px}
#search{width:100%;height:34px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;color:var(--text);padding:0 34px;font-size:13px;outline:none;transition:border .2s}
#search:focus{border-color:var(--accent)}
#searchwrap .sicon{position:absolute;left:11px;top:8px;color:var(--text3);pointer-events:none}
#searchdrop{position:absolute;top:40px;left:0;right:0;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);max-height:380px;overflow:auto;display:none;z-index:100}
#searchdrop .sd-group{padding:8px 12px 3px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--text3)}
#searchdrop .sd-item{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-radius:8px;margin:1px 5px}
#searchdrop .sd-item:hover,#searchdrop .sd-item.sel{background:var(--bg4)}
#searchdrop .sd-item .sub{margin-left:auto;color:var(--text3);font-size:11px}
.tbtn{height:32px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg3);font-size:12px;font-weight:600;color:var(--text2);transition:all .15s;white-space:nowrap}
.tbtn:hover{color:var(--text);border-color:var(--border2)}
.tbtn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
#clock{font-family:var(--font-mono);font-size:12px;color:var(--text2);white-space:nowrap}

/* ---------- Ticker tape ---------- */
#tape{height:30px;background:var(--bg2);border-bottom:1px solid var(--border);overflow:hidden;position:relative;z-index:50}
#tape .tapetrack{display:flex;gap:34px;align-items:center;height:100%;white-space:nowrap;animation:tape 60s linear infinite;width:max-content;padding-left:100%}
@keyframes tape{to{transform:translateX(-50%)}}
.tapeitem{font-family:var(--font-mono);font-size:11.5px;color:var(--text2)}
.tapeitem b{color:var(--text);font-weight:600}
.up{color:var(--pos)!important}.down{color:var(--neg)!important}.flat{color:var(--neu)!important}

/* ---------- Layout ---------- */
#main{display:flex;height:calc(100vh - 82px)}
#stage{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
#sidebar{width:340px;min-width:340px;border-left:1px solid var(--border);background:var(--bg2);display:flex;flex-direction:column;overflow:hidden}
@media(max-width:1000px){#sidebar{display:none}}

/* ---------- Map view ---------- */
#mapview{flex:1;display:flex;flex-direction:column;overflow:hidden}
#layerbar{display:flex;gap:8px;align-items:center;padding:12px 18px 4px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:20px;border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--text2);transition:all .15s;background:var(--bg2)}
.chip:hover{border-color:var(--border2);color:var(--text)}
.chip.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent;box-shadow:0 4px 14px rgba(79,142,247,.35)}
#mapbox{flex:1;position:relative}
#worldmap{width:100%;height:100%;display:block;cursor:grab}
#worldmap:active{cursor:grabbing}
.country-path{stroke:var(--map-stroke);stroke-width:.5;transition:opacity .2s;cursor:default}
.country-path.hasdata{cursor:pointer}
.country-path.hasdata:hover{opacity:.75;stroke:var(--text);stroke-width:1}
#maplegend{position:absolute;left:18px;bottom:18px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:12px;padding:12px 15px;font-size:11px;box-shadow:var(--shadow)}
#maplegend .lg-title{font-weight:700;font-size:11px;margin-bottom:8px;letter-spacing:.04em}
.lg-row{display:flex;align-items:center;gap:8px;margin-top:5px;color:var(--text2)}
.lg-swatch{width:14px;height:14px;border-radius:4px}
#maptip{position:fixed;pointer-events:none;background:var(--glass);backdrop-filter:blur(14px);border:1px solid var(--border);border-radius:13px;padding:13px 15px;min-width:250px;box-shadow:var(--shadow);z-index:200;display:none;font-size:12px}
#maptip .tt-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin-bottom:8px}
#maptip .tt-row{display:flex;justify-content:space-between;gap:18px;padding:2.5px 0;color:var(--text2)}
#maptip .tt-row b{color:var(--text);font-family:var(--font-mono);font-weight:600}
.badge{display:inline-block;padding:2px 9px;border-radius:11px;font-size:10.5px;font-weight:700}
.b-pos{background:var(--pos-bg);color:var(--pos)}
.b-neg{background:var(--neg-bg);color:var(--neg)}
.b-neu{background:var(--neu-bg);color:var(--neu)}
.b-info{background:rgba(79,142,247,.14);color:var(--accent)}
#maphint{position:absolute;top:14px;right:18px;background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:7px 13px;font-size:11.5px;color:var(--text2);backdrop-filter:blur(10px)}

/* ---------- Sidebar ---------- */
.sb-tabs{display:flex;border-bottom:1px solid var(--border)}
.sb-tab{flex:1;padding:11px 0;font-size:12px;font-weight:700;color:var(--text3);border-bottom:2px solid transparent;letter-spacing:.03em}
.sb-tab.active{color:var(--text);border-bottom-color:var(--accent)}
#sbcontent{flex:1;overflow-y:auto;padding:10px}
.newscard{background:var(--bg3);border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:9px;cursor:pointer;transition:transform .12s,border .15s}
.newscard:hover{border-color:var(--border2);transform:translateY(-1px)}
.newscard .nc-meta{display:flex;gap:6px;align-items:center;margin-bottom:7px;flex-wrap:wrap}
.newscard .nc-src{font-size:10.5px;color:var(--text3);margin-left:auto;white-space:nowrap}
.newscard h4{font-size:12.8px;line-height:1.45;font-weight:600}
.newscard .nc-sum{font-size:11.6px;color:var(--text2);line-height:1.5;margin-top:6px}
.newscard .nc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.tag{font-size:10px;padding:2px 8px;border-radius:9px;background:var(--bg4);color:var(--text2);font-weight:600;cursor:pointer}
.tag:hover{color:var(--accent)}
.mover{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.mover:hover{background:var(--bg3)}
.mover .mv-name{font-weight:600;font-size:12.5px}
.mover .mv-sub{font-size:10.5px;color:var(--text3)}
.mover .mv-px{margin-left:auto;text-align:right;font-family:var(--font-mono);font-size:12px}

/* ---------- Country dashboard ---------- */
#countryview{flex:1;overflow-y:auto;display:none;padding:20px 24px 60px}
.cv-head{display:flex;align-items:center;gap:14px;margin-bottom:4px;flex-wrap:wrap}
.cv-head h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.backbtn{display:flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:9px;font-size:12px;font-weight:600;color:var(--text2);background:var(--bg2)}
.backbtn:hover{color:var(--text);border-color:var(--border2)}
.cv-sub{color:var(--text2);font-size:12.5px;margin-bottom:16px}
.cv-tabs{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
.cv-tab{padding:8px 16px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--text2);background:var(--bg2);border:1px solid var(--border)}
.cv-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-color:transparent}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:15px 16px}
.card h3{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--text3);font-weight:700;margin-bottom:10px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .k-label{font-size:11px;color:var(--text3);font-weight:600}
.kpi .k-val{font-size:19px;font-weight:700;font-family:var(--font-mono)}
.kpi .k-sub{font-size:11px;color:var(--text2)}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:6.5px 0;border-bottom:1px solid var(--border);font-size:12.5px}
.mrow:last-child{border-bottom:none}
.mrow .ml{color:var(--text2)}
.mrow .mv{font-family:var(--font-mono);font-weight:600}
.light{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px;vertical-align:middle}
.l-g{background:var(--pos);box-shadow:0 0 8px var(--pos)}
.l-y{background:var(--neu);box-shadow:0 0 8px var(--neu)}
.l-r{background:var(--neg);box-shadow:0 0 8px var(--neg)}
table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
table.dt th{text-align:left;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--text3);padding:8px 10px;border-bottom:1px solid var(--border);font-weight:700;white-space:nowrap}
table.dt td{padding:9px 10px;border-bottom:1px solid var(--border);white-space:nowrap;font-family:var(--font-mono)}
table.dt td.tn{font-family:var(--font-ui);font-weight:600}
table.dt tr.rowlink{cursor:pointer}
table.dt tr.rowlink:hover td{background:var(--bg3)}
.sparkline{vertical-align:middle}

/* ---------- Modal (company) ---------- */
#modalback{position:fixed;inset:0;background:rgba(5,8,14,.62);backdrop-filter:blur(6px);z-index:300;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:34px 20px}
#modal{background:var(--bg);border:1px solid var(--border2);border-radius:18px;width:min(1060px,100%);box-shadow:var(--shadow);animation:pop .22s ease;margin-bottom:40px}
@keyframes pop{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
#modal .m-head{display:flex;align-items:center;gap:14px;padding:20px 24px 0;flex-wrap:wrap}
#modal .m-body{padding:18px 24px 26px}
.xbtn{margin-left:auto;width:32px;height:32px;border-radius:9px;border:1px solid var(--border);color:var(--text2);font-size:15px}
.xbtn:hover{color:var(--text);border-color:var(--border2)}
.rangebar{display:flex;gap:5px;flex-wrap:wrap}
.rbtn{padding:5px 12px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--text3);border:1px solid transparent}
.rbtn.active{background:var(--bg3);color:var(--text);border-color:var(--border)}
.ind-toggles{display:flex;gap:5px;flex-wrap:wrap}
.itog{padding:4px 11px;border-radius:8px;font-size:10.5px;font-weight:700;color:var(--text3);border:1px dashed var(--border)}
.itog.on{color:var(--accent);border-style:solid;border-color:var(--accent)}
#pxchart{width:100%;display:block}
.ai-section{border-left:3px solid var(--accent);padding:10px 14px;background:var(--bg2);border-radius:0 10px 10px 0;margin-bottom:10px}
.ai-section h4{font-size:12px;font-weight:700;margin-bottom:4px;color:var(--accent)}
.ai-section p{font-size:12.5px;color:var(--text2);line-height:1.55}
.scenario{flex:1;min-width:180px;border:1px solid var(--border);border-radius:12px;padding:13px}
.scenario .sc-px{font-size:21px;font-weight:800;font-family:var(--font-mono);margin:5px 0}

/* ---------- Copilot ---------- */
#copbtn{position:fixed;right:24px;bottom:24px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:21px;box-shadow:0 8px 26px rgba(79,142,247,.45);z-index:250;transition:transform .15s}
#copbtn:hover{transform:scale(1.07)}
#copilot{position:fixed;right:24px;bottom:88px;width:390px;max-width:calc(100vw - 40px);height:520px;max-height:calc(100vh - 130px);background:var(--glass);backdrop-filter:blur(18px);border:1px solid var(--border2);border-radius:18px;box-shadow:var(--shadow);z-index:250;display:none;flex-direction:column;overflow:hidden;animation:pop .2s ease}
#copilot .cp-head{padding:14px 16px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px;display:flex;align-items:center;gap:9px}
#cpmsgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.cpmsg{max-width:88%;padding:10px 13px;border-radius:14px;font-size:12.5px;line-height:1.55;white-space:pre-wrap}
.cp-user{align-self:flex-end;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border-bottom-right-radius:4px}
.cp-ai{align-self:flex-start;background:var(--bg3);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text)}
.cp-sugs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 8px}
.cp-sug{font-size:10.5px;padding:5px 10px;border-radius:11px;border:1px solid var(--border);color:var(--text2);cursor:pointer;background:var(--bg2)}
.cp-sug:hover{color:var(--accent);border-color:var(--accent)}
#cpform{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}
#cpinput{flex:1;height:36px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:0 12px;font-size:12.5px;outline:none}
#cpinput:focus{border-color:var(--accent)}

/* ---------- Misc ---------- */
.fade{animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pill-imp{font-size:9.5px;letter-spacing:.06em;padding:2px 7px;border-radius:8px;font-weight:800;text-transform:uppercase}
.imp-high{background:var(--neg-bg);color:var(--neg)}
.imp-med{background:var(--neu-bg);color:var(--neu)}
.imp-low{background:var(--bg4);color:var(--text3)}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(80px);background:var(--glass);border:1px solid var(--border2);border-radius:12px;padding:11px 18px;font-size:12.5px;box-shadow:var(--shadow);z-index:400;transition:transform .3s;backdrop-filter:blur(12px)}
#toast.show{transform:translateX(-50%) translateY(0)}
select.fsel{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:6px 9px;font-size:11.5px;font-weight:600;outline:none}
.disclaimer{font-size:10.5px;color:var(--text3);text-align:center;padding:8px}

/* ---------- Alert center & day engine ---------- */
#alertwrap{position:relative}
#alertbadge{position:absolute;top:-5px;right:-5px;min-width:17px;height:17px;border-radius:9px;background:var(--neg);color:#fff;font-size:10px;font-weight:800;display:none;align-items:center;justify-content:center;padding:0 4px;box-shadow:0 0 0 2px var(--bg2)}
#alertbtn.pulse{animation:bellpulse 1s ease 3}
@keyframes bellpulse{0%,100%{transform:none}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
#alertpanel{position:absolute;top:42px;right:0;width:400px;max-width:calc(100vw - 30px);max-height:480px;background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--border2);border-radius:14px;box-shadow:var(--shadow);z-index:120;display:none;flex-direction:column;overflow:hidden;animation:pop .18s ease}
#alertpanel .ap-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:700;font-size:13px}
#alertlist{overflow-y:auto;padding:8px}
.alertitem{display:flex;gap:10px;padding:10px 11px;border-radius:11px;cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.alertitem:hover{background:var(--bg3);border-color:var(--border)}
.alertitem.unread{background:var(--bg3)}
.alertitem .ai-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0}
.alertitem .ai-txt{font-size:12px;line-height:1.45}
.alertitem .ai-meta{font-size:10.5px;color:var(--text3);margin-top:3px}
#dayctl{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text2);white-space:nowrap}
#dayctl b{font-family:var(--font-mono);color:var(--text)}
#daybtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);font-size:13px;color:var(--text2)}
#daybtn:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>
<div id="topbar">
  <div class="logo"><span class="dot"></span>ATLAS<small data-i18n="tagline">GLOBAL INTELLIGENCE</small></div>
  <div id="searchwrap">
    <span class="sicon">⌕</span>
    <input id="search" autocomplete="off" placeholder="">
    <div id="searchdrop"></div>
  </div>
  <span id="clock"></span>
  <div id="dayctl"><span data-i18n="dayLabel">Día</span> <b id="dayind">D+0</b><button id="daybtn" title="Avanzar día">⏭</button></div>
  <div id="alertwrap">
    <button class="tbtn" id="alertbtn">🔔 <span data-i18n="alerts">Alertas</span><span id="alertbadge">0</span></button>
    <div id="alertpanel">
      <div class="ap-head">🔔 <span data-i18n="alertsTitle">Centro de alertas</span>
        <button class="tbtn" style="margin-left:auto;height:26px;font-size:11px" id="markread" data-i18n="markRead">Marcar leídas</button></div>
      <div id="alertlist"></div>
    </div>
  </div>
  <button class="tbtn" id="langbtn">EN</button>
  <button class="tbtn" id="themebtn">☀️</button>
</div>
<div id="tape"><div class="tapetrack" id="tapetrack"></div></div>
<div id="main">
  <div id="stage">
    <div id="mapview">
      <div id="layerbar"></div>
      <div id="mapbox">
        <svg id="worldmap"></svg>
        <div id="maplegend"></div>
        <div id="maphint" data-i18n="maphint">Haz clic en un país para abrir su dashboard</div>
      </div>
    </div>
    <div id="countryview"></div>
  </div>
  <div id="sidebar">
    <div class="sb-tabs">
      <button class="sb-tab active" data-sb="news" data-i18n="sbNews">Noticias</button>
      <button class="sb-tab" data-sb="movers" data-i18n="sbMovers">Top Movers</button>
      <button class="sb-tab" data-sb="geo" data-i18n="sbGeo">Geopolítica</button>
    </div>
    <div id="sbcontent"></div>
    <div class="disclaimer" data-i18n="demo">Datos simulados · Prototipo demostrativo</div>
  </div>
</div>

async function initMap(){
  if(typeof d3==='undefined'||typeof topojson==='undefined'){mapFallback();return}
  const box=document.getElementById('mapbox');
  const svg=d3.select('#worldmap');
  const W=box.clientWidth||1000,H=box.clientHeight||620;
  svg.attr('viewBox',`0 0 ${W} ${H}`);
  projection=d3.geoNaturalEarth1().scale(W/5.6).translate([W/2,H/1.82]);
  const path=d3.geoPath(projection);
  svgG=svg.append('g');
  try{
    const world=await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json').then(r=>r.json());
    const countries=topojson.feature(world,world.objects.countries).features.filter(f=>+f.id!==10);
    geoPaths=svgG.selectAll('path').data(countries).join('path').attr('d',path)
      .on('mousemove',(ev,d)=>{const c=CBYISO[+d.id];if(c)showTip(ev,c);else hideTip()})
      .on('mouseleave',hideTip)
      .on('click',(ev,d)=>{const c=CBYISO[+d.id];if(c)openCountry(c.code)});
    paintMap();

  }catch(e){mapFallback()}
}

async function fetchViaProxy(url){
  const proxies=[u=>'https://api.allorigins.win/raw?url='+encodeURIComponent(u),u=>'https://corsproxy.io/?url='+encodeURIComponent(u)];
  for(const p of proxies){
    try{
      const ctl=new AbortController();const to=setTimeout(()=>ctl.abort(),9000);
      const r=await fetch(p(url),{signal:ctl.signal});clearTimeout(to);
      if(r.ok){const txt=await r.text();if(txt.includes('<item'))return txt}
    }catch(e){}
  }
  return null;
}
async function refreshLive(){
  if(liveLoading)return;
  liveLoading=true;if(sbTab==='news')renderSidebar();
  const results=await Promise.all(FEEDS.map(async f=>{
    const xml=await fetchViaProxy(f.url);if(!xml)return[];
    try{
      const doc=new DOMParser().parseFromString(xml,'text/xml');
      return [...doc.querySelectorAll('item')].slice(0,12).map(it=>{
        const g=s=>it.getElementsByTagName(s)[0]?.textContent||'';
        return {src:f.src,title:g('title').trim(),link:g('link').trim(),
          date:new Date(g('pubDate')||Date.now()),
          desc:g('description').replace(/<[^>]*>/g,'').replace(/&[a-z#0-9]+;/gi,' ').trim().slice(0,220)};
      });
    }catch(e){return[]}
  }));
  let items=results.flat().filter(i=>i.title&&!isNaN(i.date));
  const seen=new Set();
  items=items.filter(i=>{const k=i.title.toLowerCase().slice(0,60);if(seen.has(k))return false;seen.add(k);return true});
  const recent=items.filter(i=>Date.now()-i.date<48*3600e3);
  if(recent.length>=5)items=recent;
  items.sort((a,b)=>b.date-a.date);
  liveItems=items.slice(0,45).map(i=>({...i,...classifyLive(i.title+' '+i.desc)}));
  liveUpdated=new Date();liveLoading=false;
  liveItems.filter(i=>i.imp==='high'&&i.ccs.length).slice(0,6).forEach(i=>{
    const key='live'+hashCode(i.title);
    if(!ALERTS.some(a=>a.key===key)){

  });

  if(sbTab==='news')renderSidebar();
}

/* ==================== SVG chart helpers ==================== */
function genSeries(seed,n,start,volat,drift){
  const rnd=mulberry32(seed);let p=start;const out=[];
  for(let i=0;i<n;i++){p*=1+(rnd()-0.5)*volat+drift;out.push(p)}
  return out;
}
function sma(arr,w){return arr.map((_,i)=>i<w-1?null:arr.slice(i-w+1,i+1).reduce((a,b)=>a+b,0)/w)}
function stdev(arr){const m=arr.reduce((a,b)=>a+b,0)/arr.length;return Math.sqrt(arr.reduce((a,b)=>a+(b-m)**2,0)/arr.length)}
function calcRSI(prices,w=14){
  const rsi=[null];let g=0,l=0;
  for(let i=1;i<prices.length;i++){
    const ch=prices[i]-prices[i-1];const up=Math.max(ch,0),dn=Math.max(-ch,0);
    if(i<=w){g+=up;l+=dn;rsi.push(null);if(i===w){g/=w;l/=w;rsi[i]=100-100/(1+(l===0?100:g/l))}}
    else{g=(g*(w-1)+up)/w;l=(l*(w-1)+dn)/w;rsi.push(100-100/(1+(l===0?100:g/l)))}
  }
  return rsi;
}
function linePath(vals,x,y){let d='';vals.forEach((v,i)=>{if(v==null)return;d+=(d===''?'M':'L')+x(i).toFixed(1)+','+y(v).toFixed(1)});return d}
function sparkSVG(seed,up){
  const s=genSeries(seed,28,100,0.03,up?0.003:-0.003);
  const min=Math.min(...s),max=Math.max(...s);
  const x=i=>i*(84/27),y=v=>22-(v-min)/(max-min+1e-9)*20;
  return `<svg class="sparkline" width="84" height="24" viewBox="0 0 84 24"><path d="${linePath(s,x,y)}" fill="none" stroke="${up?'var(--pos)':'var(--neg)'}" stroke-width="1.6"/></svg>`;
}

function macroLight(kind,c){
  const v=parseFloat(String(c.macro[kind]).replace(',','.'));
  if(kind==='cpi')return v<=2.5?'l-g':v<=4?'l-y':'l-r';
  if(kind==='gdp')return v>=2?'l-g':v>=0.8?'l-y':'l-r';
  if(kind==='unemp')return v<=5?'l-g':v<=9?'l-y':'l-r';
  if(kind==='debt')return v<=70?'l-g':v<=110?'l-y':'l-r';
  if(kind==='deficit')return v>=-3?'l-g':v>=-5.5?'l-y':'l-r';
  if(kind==='pmiM'||kind==='pmiS')return c.macro[kind]>=52?'l-g':c.macro[kind]>=49?'l-y':'l-r';
  return 'l-y';
}
function yieldCurveSVG(c,W=460,H=190){
  const pts=[[2,c.bonds.y2],[5,c.bonds.y5],[10,c.bonds.y10],[30,c.bonds.y30]];
  const us=C.US.bonds,usPts=[[2,us.y2],[5,us.y5],[10,us.y10],[30,us.y30]];
  const allY=pts.concat(c.code==='US'?[]:usPts).map(p=>p[1]);
  const ymin=Math.min(...allY)-0.25,ymax=Math.max(...allY)+0.25;
  const xs=v=>40+(Math.log(v)/Math.log(30))*(W-60);
  const ys=v=>H-28-(v-ymin)/(ymax-ymin)*(H-52);
  const mk=(ps,col,w,dash)=>`<path d="${ps.map((p,i)=>(i?'L':'M')+xs(p[0])+','+ys(p[1])).join('')}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?'stroke-dasharray="4 4"':''}/>`+
    ps.map(p=>`<circle cx="${xs(p[0])}" cy="${ys(p[1])}" r="3.4" fill="${col}"/>`).join('');
  let grid='';
  for(let g=Math.ceil(ymin*2)/2;g<=ymax;g+=0.5){grid+=`<line x1="40" y1="${ys(g)}" x2="${W-20}" y2="${ys(g)}" stroke="var(--border)" stroke-width="1"/><text x="34" y="${ys(g)+4}" text-anchor="end" font-size="10" fill="var(--text3)">${fmt(g,1)}</text>`}
  const xlabels=pts.map(p=>`<text x="${xs(p[0])}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--text3)">${p[0]}${LANG==='es'?'A':'Y'}</text>`).join('');
  const legend=c.code==='US'?'':`<rect x="${W-160}" y="8" width="10" height="3" fill="var(--text3)"/><text x="${W-145}" y="13" font-size="10" fill="var(--text3)">US Treasuries</text>`;
  return `<svg width="100%" viewBox="0 0 ${W} ${H}">${grid}${c.code==='US'?'':mk(usPts,'var(--text3)',1.4,true)}${mk(pts,'var(--accent)',2.2,false)}${xlabels}${legend}</svg>`;
}

  }

  out+=`<line x1="52" y1="${y(rmax)}" x2="${W-20}" y2="${y(rmax)}" stroke="var(--neg)" stroke-width="1" stroke-dasharray="6 4" opacity=".55"/><text x="${W-22}" y="${y(rmax)-4}" text-anchor="end" font-size="9.5" fill="var(--neg)">R ${fmt(rmax,1)}</text>`;

function buildSearchIndex(){
  const idx=[];
  COUNTRIES.forEach(c=>idx.push({type:'country',label:`${c.flag} ${c.name[LANG]}`,sub:c.ccy,key:(c.name.es+' '+c.name.en+' '+c.code).toLowerCase(),act:()=>openCountry(c.code)}));
  COMPANIES.forEach(co=>idx.push({type:'company',label:`${co.nm}`,sub:`${co.tk} · ${C[co.cc].flag} ${co.sec[LANG]}`,key:(co.nm+' '+co.tk).toLowerCase(),act:()=>openCompany(co.tk)}));
  COUNTRIES.forEach(c=>c.indices.forEach(i=>idx.push({type:'index',label:i.n,sub:`${c.flag} ${fmt(i.v,0)} · ${pct(i.chg)}`,key:i.n.toLowerCase(),act:()=>openCountry(c.code)})));
  NEWS.forEach(n=>idx.push({type:'news',label:n.h[LANG].slice(0,70)+(n.h[LANG].length>70?'…':''),sub:n.src,key:(n.h.es+' '+n.h.en).toLowerCase(),act:()=>{sbTab='news';renderSidebar();document.querySelectorAll('.sb-tab').forEach(x=>x.classList.toggle('active',x.dataset.sb==='news'));closeCountry();showToast(LANG==='es'?'Noticia disponible en el panel lateral':'News available in the side panel')}}));
  return idx;
}
let searchIdx=[];
searchEl.addEventListener('input',()=>{
  const q=searchEl.value.trim().toLowerCase();
  if(q.length<2){dropEl.style.display='none';return}
  const res=searchIdx.filter(i=>i.key.includes(q)).slice(0,12);
  if(!res.length){dropEl.style.display='none';return}
  const groups={country:LANG==='es'?'Países':'Countries',company:LANG==='es'?'Empresas':'Companies',index:LANG==='es'?'Índices':'Indices',news:LANG==='es'?'Noticias':'News'};
  let html='',last='';
  res.forEach((r,i)=>{if(r.type!==last){html+=`<div class="sd-group">${groups[r.type]}</div>`;last=r.type}
    html+=`<div class="sd-item" data-i="${i}">${r.label}<span class="sub">${r.sub}</span></div>`});
  dropEl.innerHTML=html;dropEl.style.display='block';
  dropEl.querySelectorAll('.sd-item').forEach(el=>el.onclick=()=>{res[+el.dataset.i].act();dropEl.style.display='none';searchEl.value=''});
});
document.addEventListener('click',e=>{if(!e.target.closest('#searchwrap'))dropEl.style.display='none'});
searchEl.addEventListener('keydown',e=>{if(e.key==='Escape'){dropEl.style.display='none';searchEl.blur()}});
document.addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==searchEl&&document.activeElement.id!=='cpinput'){e.preventDefault();searchEl.focus()}

  const html=document.documentElement;
  const nx=html.dataset.theme==='dark'?'light':'dark';
  html.dataset.theme=nx;

  paintMap();
};
document.getElementById('langbtn').onclick=()=>{
  LANG=LANG==='es'?'en':'es';
  document.getElementById('langbtn').textContent=LANG==='es'?'EN':'ES';
  document.documentElement.lang=LANG;
  applyI18n();

function applyI18n(){
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=t(el.dataset.i18n));
  searchEl.placeholder=t('searchPh');
  document.getElementById('cpinput').placeholder=t('cpPh');
  renderLayerbar();renderLegend();renderTape();renderSidebar();
  searchIdx=buildSearchIndex();
  if(currentCountry)renderCountry();
  if(curCo)renderCompany();
  if(copInit){renderSugs()}
  if(typeof updateAlertUI==='function'){updateAlertUI();document.getElementById('dayind').textContent='D+'+simDay+(simDay?' · '+simDate():'')}
}
function tickClock(){
  const now=new Date();
  document.getElementById('clock').textContent=now.toLocaleTimeString(LANG==='es'?'es-ES':'en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}
setInterval(tickClock,1000);

/* ==================== Daily engine & alert center ==================== */
let simDay=0;const ALERTS=[];
const EVENTS=[
 {sev:'high',fx:c=>{c.sentiment=Math.max(-2,c.sentiment-1);c.riskCty=Math.min(95,c.riskCty+7);c.bonds.chg10+=8;c.bonds.y10=+(c.bonds.y10+0.08).toFixed(2)},
  m:{es:c=>`La inflación de ${c.name.es} sorprende al alza: los bonos se venden y el 10 años sube 8 pb`,en:c=>`${c.name.en} inflation surprises to the upside: bonds sell off, 10Y up 8 bp`}},
 {sev:'high',fx:c=>{c.riskCty=Math.min(95,c.riskCty+9);c.sentiment=Math.max(-2,c.sentiment-1)},
  m:{es:c=>`Una agencia de rating pone la deuda de ${c.name.es} en revisión negativa`,en:c=>`A rating agency puts ${c.name.en}'s debt on negative watch`}},
 {sev:'high',fx:c=>{c.riskGeo=Math.min(95,c.riskGeo+12);c.riskGeoL='high';c.indices.forEach(i=>i.chg-=0.8)},
  m:{es:c=>`Escalada geopolítica que implica a ${c.name.es}: la bolsa cae y sube la prima de riesgo`,en:c=>`Geopolitical escalation involving ${c.name.en}: equities drop, risk premium rises`}},
 {sev:'medium',fx:c=>{c.sentiment=Math.max(-2,c.sentiment-1);c.indices.forEach(i=>i.chg-=0.5)},
  m:{es:c=>`El PMI manufacturero de ${c.name.es} entra en zona de contracción`,en:c=>`${c.name.en}'s manufacturing PMI slips into contraction`}},
 {sev:'medium',fx:c=>{c.bonds.chg10+=5;c.bonds.y10=+(c.bonds.y10+0.05).toFixed(2);c.bondP=Math.min(95,c.bondP+6)},
  m:{es:c=>`Subasta de deuda débil en ${c.name.es}: la demanda cae y el Tesoro paga más`,en:c=>`Weak debt auction in ${c.name.en}: demand drops and the Treasury pays up`}},
 {sev:'medium',fx:c=>{c.riskPol='high';c.riskCty=Math.min(95,c.riskCty+5)},
  m:{es:c=>`Crisis política en ${c.name.es}: el gobierno pierde una votación clave de presupuestos`,en:c=>`Political crisis in ${c.name.en}: the government loses a key budget vote`}},
 {sev:'medium',fx:c=>{c.fxStr=Math.max(-2,c.fxStr-0.6);c.fx.chg=+(-(Math.random()*0.9+0.3)).toFixed(2)},
  m:{es:c=>`La divisa de ${c.name.es} se deprecia con fuerza frente al dólar`,en:c=>`${c.name.en}'s currency depreciates sharply against the dollar`}},
 {sev:'low',fx:c=>{c.sentiment=Math.min(2,c.sentiment+1);c.indices.forEach(i=>i.chg+=0.6)},
  m:{es:c=>`El PIB de ${c.name.es} bate previsiones y la bolsa lo celebra`,en:c=>`${c.name.en}'s GDP beats forecasts and equities cheer`}},
 {sev:'low',fx:c=>{c.flow=Math.min(2,c.flow+0.6);c.riskCty=Math.max(3,c.riskCty-4)},
  m:{es:c=>`Fuertes entradas de capital extranjero en ${c.name.es}: mejora el riesgo país`,en:c=>`Strong foreign inflows into ${c.name.en}: country risk improves`}},
 {sev:'low',fx:c=>{c.sentiment=Math.min(2,c.sentiment+1);c.bonds.chg10-=4;c.bonds.y10=+(c.bonds.y10-0.04).toFixed(2)},
  m:{es:c=>`El banco central de ${c.name.es} sugiere recortes de tipos: los bonos suben`,en:c=>`${c.name.en}'s central bank hints at rate cuts: bonds rally`}},
];
function simDate(){const d=new Date();d.setDate(d.getDate()+simDay);return d.toLocaleDateString(LANG==='es'?'es-ES':'en-US',{day:'numeric',month:'short'})}
function advanceDay(){
  simDay++;
  COUNTRIES.forEach(c=>{c.indices.forEach(i=>{const dv=+((Math.random()-0.5)*1.6).toFixed(2);i.chg=dv;i.v=Math.max(10,Math.round(i.v*(1+dv/100)))});
    const bm=Math.round((Math.random()-0.5)*8);c.bonds.chg10=bm;c.bonds.y10=+(Math.max(0.05,c.bonds.y10+bm/100)).toFixed(2);
    c.fx.chg=+((Math.random()-0.5)*0.8).toFixed(2)});
  COMPANIES.forEach(co=>{const dv=+((Math.random()-0.5)*3.4).toFixed(2);co.m=+(co.m+co.d/4).toFixed(1);co.w=+((co.w*0.7)+dv*0.3).toFixed(1);co.d=dv;co.px=+(co.px*(1+dv/100)).toFixed(2)});
  const n=1+Math.floor(Math.random()*3);
  const used=new Set();
  for(let i=0;i<n;i++){
    const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
    let c=COUNTRIES[Math.floor(Math.random()*COUNTRIES.length)];
    if(used.has(c.code))continue;used.add(c.code);
    ev.fx(c);
    const msg=ev.m[LANG==='es'?'es':'en'](c);
    ALERTS.unshift({day:simDay,date:simDate(),cc:c.code,sev:ev.sev,msg:{es:ev.m.es(c),en:ev.m.en(c)},unread:true});
    if(ev.sev==='high'){showToast(`🚨 ${c.flag} ${msg}`);const b=document.getElementById('alertbtn');b.classList.remove('pulse');void b.offsetWidth;b.classList.add('pulse')}
  }
  if(ALERTS.length>60)ALERTS.length=60;
  updateAlertUI();
  document.getElementById('dayind').textContent='D+'+simDay+' · '+simDate();
  renderTape();renderSidebar();paintMap();renderLegend();
  if(currentCountry)renderCountry();
}
function updateAlertUI(){
  const unread=ALERTS.filter(a=>a.unread).length;
  const badge=document.getElementById('alertbadge');
  badge.style.display=unread?'flex':'none';badge.textContent=unread;
  const list=document.getElementById('alertlist');
  if(!ALERTS.length){list.innerHTML=`<div style="padding:18px 14px;font-size:12px;color:var(--text2);line-height:1.55">${t('noAlerts')}</div>`;return}
  list.innerHTML=ALERTS.slice(0,40).map((a,i)=>{
    const col=a.sev==='high'?'var(--neg)':a.sev==='medium'?'var(--neu)':'var(--pos)';
    const c=C[a.cc];
    return `<div class="alertitem ${a.unread?'unread':''}" onclick="alertClick(${i})">
      <span class="ai-dot" style="background:${col};box-shadow:0 0 7px ${col}"></span>
      <div><div class="ai-txt">${c.flag} ${a.msg[LANG]}</div><div class="ai-meta">D+${a.day} · ${a.date} · ${t('severity')}: ${a.sev==='high'?t('highR'):a.sev==='medium'?t('mediumR'):t('lowR')}</div></div>
    </div>`}).join('');
}
function alertClick(i){
  const a=ALERTS[i];if(!a)return;
  a.unread=false;updateAlertUI();toggleAlertPanel(false);
  if(a.link)window.open(a.link,'_blank');else openCountry(a.cc);
}
function toggleAlertPanel(force){
  const p=document.getElementById('alertpanel');
  const show=force!==undefined?force:p.style.display!=='flex';
  p.style.display=show?'flex':'none';
  if(show)updateAlertUI();
}
document.getElementById('alertbtn').onclick=()=>toggleAlertPanel();
document.getElementById('markread').onclick=e=>{e.stopPropagation();ALERTS.forEach(a=>a.unread=false);updateAlertUI()};
document.addEventListener('click',e=>{if(!e.target.closest('#alertwrap'))toggleAlertPanel(false)});
document.getElementById('daybtn').onclick=advanceDay;
setInterval(advanceDay,60000);

window.toggleNews=toggleNews;window.openCountry=openCountry;window.openCompany=openCompany;
window.closeCountry=closeCountry;window.closeCompany=closeCompany;window.makeAlert=makeAlert;window.askCop=askCop;
window.setLive=setLive;window.refreshLive=refreshLive;window.alertClick=alertClick;

/* ==================== REAL DATA loader (data/*.json generados por GitHub Actions) ==================== */
let realDataStamp=null;
async function loadRealData(){
  try{
    const r=await fetch('data/market.json?_='+Date.now());
    if(r.ok){
      const D=await r.json();
      realDataStamp=D.updated||null;
      if(D.indices)COUNTRIES.forEach(c=>{const arr=D.indices[c.code];if(!arr)return;
        c.indices.forEach(ix=>{const hit=arr.find(a=>a.n===ix.n);if(hit&&hit.v!=null){ix.v=hit.v;ix.chg=hit.chg??ix.chg}})});
      if(D.fx)COUNTRIES.forEach(c=>{const f=D.fx[c.code];if(f&&f.v!=null){c.fx.v=f.v;c.fx.chg=f.chg??c.fx.chg}});
      if(D.companies)COMPANIES.forEach(co=>{const q=D.companies[co.tk];if(q&&q.px!=null){co.px=q.px;if(q.d!=null)co.d=q.d;if(q.w!=null)co.w=q.w;if(q.m!=null)co.m=q.m}});
      if(D.us10y!=null){C.US.bonds.y10=D.us10y}
      renderTape();renderSidebar();
      if(realDataStamp){
        const when=new Date(realDataStamp).toLocaleString(LANG==='es'?'es-ES':'en-US',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
        const hint=document.getElementById('maphint');
        if(hint)hint.innerHTML=`<span style="color:var(--pos);font-weight:700">● ${LANG==='es'?'Datos reales':'Real data'}</span> · ${when} · ${t('maphint')}`;
      }
    }
  }catch(e){}
  try{
    const r2=await fetch('data/news.json?_='+Date.now());
    if(r2.ok){
      const N=await r2.json();
      if(Array.isArray(N)&&N.length){
        liveItems=N.map(i=>({src:i.source,title:i.title,link:i.link,date:new Date(i.date),desc:i.desc||'',ccs:i.ccs||[],cat:CATS[i.cat]?i.cat:'eq',imp:i.imp||'low'}));
        liveUpdated=realDataStamp?new Date(realDataStamp):new Date();
        liveMode=true;
        liveItems.filter(i=>i.imp==='high'&&i.ccs.length).slice(0,6).forEach(i=>{
          const key='live'+hashCode(i.title);
          if(!ALERTS.some(a=>a.key===key))ALERTS.unshift({key,day:simDay,date:simDate(),cc:i.ccs[0],sev:'high',msg:{es:'📰 '+i.title,en:'📰 '+i.title},unread:true,link:i.link});
        });
        updateAlertUI();renderSidebar();
      }
    }
  }catch(e){}
}
applyI18n();tickClock();initMap();loadRealData();
</script>
