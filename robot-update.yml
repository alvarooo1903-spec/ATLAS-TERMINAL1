# ============================================================
# ROBOT DE ACTUALIZACIÓN — copia este contenido en GitHub:
# Add file → Create new file → nombre: .github/workflows/update.yml
# (escribe el nombre tal cual, con los puntos y las barras:
#  GitHub creará las carpetas automáticamente)
# ============================================================
name: Actualizar datos de mercado

on:
  schedule:
    # 06:00 y 16:30 UTC, de lunes a viernes
    - cron: "0 6 * * 1-5"
    - cron: "30 16 * * 1-5"
  workflow_dispatch: {}   # permite lanzarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Descargar datos y noticias
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_data.py

      - name: Publicar cambios
        run: |
          git config user.name "atlas-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: actualización automática $(date -u +'%Y-%m-%d %H:%M')"
          git push
